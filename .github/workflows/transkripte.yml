name: Transkripte holen

on:
  schedule:
    # 04:30 UTC = 05:30 Uhr (Winterzeit) bzw. 06:30 Uhr (Sommerzeit) in Berlin,
    # damit die Transkripte vor der Auswertung um 8 Uhr vorliegen.
    # GitHub startet geplante Läufe oft mit Verspätung.
    - cron: "30 4 * * *"
  workflow_dispatch:
    inputs:
      start_tage:
        description: "Rückblick in Tagen beim ersten Lauf eines Kanals"
        default: "7"
      max_videos:
        description: "Höchstens so viele Transkripte pro Lauf"
        default: "40"

permissions:
  contents: write
  actions: write

concurrency:
  group: transkripte
  cancel-in-progress: false

jobs:
  holen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Transkripte holen
        env:
          START_TAGE: ${{ inputs.start_tage || '7' }}
          MAX_VIDEOS: ${{ inputs.max_videos || '40' }}
        run: python holen.py

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A transkripte index.json kanal_ids.json letzter_lauf.json
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
          else
            git commit -m "Transkripte $(TZ=Europe/Berlin date +%F)"
            git push
          fi

      - name: Blockade prüfen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(python -c "import json;print(json.load(open('letzter_lauf.json')).get('blockiert_in_folge',0))")
          if [ "$n" -ge 3 ]; then
            echo "YouTube hat $n Läufe in Folge blockiert – täglicher Zeitplan wird abgeschaltet."
            gh workflow disable transkripte.yml --repo "$GITHUB_REPOSITORY"
          fi
          if [ "$n" -gt 0 ]; then
            echo "::error::Von YouTube blockiert ($n. Lauf in Folge)"
            exit 1
          fi
